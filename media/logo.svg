<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <!-- گرادیان پس‌زمینه داشبورد -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        
        <!-- گرادیان قرمز یوتیوب -->
        <linearGradient id="ytRed" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="100%" stop-color="#991b1b"/>
        </linearGradient>
        
        <!-- گرادیان آبی تلگرام -->
        <linearGradient id="tgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        
        <!-- گرادیان‌های شیشه‌ای برای موشک/دکمه پلی -->
        <linearGradient id="glassWhite" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
        </linearGradient>
        
        <linearGradient id="glassDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
        </linearGradient>

        <!-- سایه‌ها و درخشش‌های نئونی -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
        </filter>
        
        <filter id="glowRed">
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.7"/>
        </filter>
        
        <filter id="glowBlue">
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.7"/>
        </filter>

        <filter id="glowGreen">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.8"/>
        </filter>
    </defs>

    <!-- آنتن ربات -->
    <line x1="100" y1="25" x2="100" y2="8" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <circle cx="100" cy="8" r="6" fill="#10b981" filter="url(#glowGreen)"/>

    <!-- بدنه اصلی آیکون (تاریک و شیشه‌ای) -->
    <rect x="20" y="25" width="160" height="155" rx="40" fill="url(#bgGrad)" filter="url(#shadow)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

    <!-- حلقه سمت چپ (انرژی یوتیوب) -->
    <path d="M 100 45 A 55 55 0 0 0 100 155" fill="none" stroke="url(#ytRed)" stroke-width="8" stroke-linecap="round" filter="url(#glowRed)"/>

    <!-- حلقه سمت راست (انرژی تلگرام) -->
    <path d="M 100 155 A 55 55 0 0 0 100 45" fill="none" stroke="url(#tgBlue)" stroke-width="8" stroke-linecap="round" filter="url(#glowBlue)"/>

    <!-- بدنه مرکزی: ترکیب دکمه Play و موشک کاغذی تلگرام -->
    <path d="M 65 55 L 140 100 L 80 100 Z" fill="url(#glassWhite)" filter="url(#shadow)"/>
    <path d="M 65 145 L 140 100 L 80 100 Z" fill="url(#glassDark)"/>
    
    <!-- آیکون دانلود در قلب موشک -->
    <g transform="translate(80, 71) scale(0.65)" filter="url(#shadow)">
        <path d="M 25 10 L 45 10 L 45 45 L 60 45 L 35 75 L 10 45 L 25 45 Z" fill="#10b981" />
        <rect x="10" y="85" width="50" height="10" rx="5" fill="#10b981"/>
    </g>
</svg>
