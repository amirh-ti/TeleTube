<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Encoder / Decoder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      max-width: 720px;
      margin: 30px auto;
      padding: 20px;
      background: #f6f8fa;
      color: #24292f;
      transition: direction 0.2s;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 22px; margin: 0; }
    .lang-switch button {
      padding: 6px 12px;
      border: 1px solid #d0d7de;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-inline-start: 4px;
    }
    .lang-switch button.active {
      background: #0969da;
      color: #fff;
      border-color: #0969da;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 1px solid #d0d7de;
    }
    .tab {
      padding: 10px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      color: #57606a;
    }
    .tab.active {
      color: #0969da;
      border-bottom-color: #0969da;
      font-weight: 600;
    }
    .card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      height: 130px;
      padding: 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
      resize: vertical;
      font-family: inherit;
    }
    .output {
      margin-top: 12px;
      padding: 10px;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      min-height: 60px;
      max-height: 300px;
      overflow: auto;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      direction: ltr;
      text-align: left;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    button.btn {
      padding: 9px 16px;
      background: #2da44e;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button.btn:hover { background: #218838; }
    button.btn.blue { background: #0969da; }
    button.btn.blue:hover { background: #0550ae; }
    button.btn.gray { background: #6e7781; }
    button.btn.gray:hover { background: #57606a; }
    button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .options { margin-top: 10px; font-size: 13px; }
    .options label { cursor: pointer; user-select: none; }
    .file-info {
      margin-top: 8px;
      font-size: 13px;
      color: #57606a;
    }
    .hidden { display: none !important; }
    input[type="file"] {
      width: 100%;
      padding: 8px;
      border: 1px dashed #d0d7de;
      border-radius: 6px;
      background: #fafbfc;
      cursor: pointer;
    }
    .error { color: #cf222e; }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="page-title">Base64 Encoder / Decoder</h1>
    <div class="lang-switch">
      <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
      <button id="btn-fa" onclick="setLang('fa')">FA</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-text-btn" onclick="switchTab('text')">Text</button>
    <button class="tab" id="tab-file-btn" onclick="switchTab('file')">File</button>
  </div>

  <!-- ================= TEXT TAB ================= -->
  <div id="tab-text" class="card">
    <textarea id="text-input" placeholder="Enter text here..."></textarea>
    <div class="actions">
      <button class="btn" onclick="encodeText()" id="btn-encode-text">Encode to Base64</button>
      <button class="btn blue" onclick="decodeText()" id="btn-decode-text">Decode from Base64</button>
      <button class="btn gray" onclick="clearText()" id="btn-clear-text">Clear</button>
    </div>
    <div class="output" id="text-output"></div>
    <div class="actions">
      <button class="btn blue" onclick="copyOut('text-output')" id="btn-copy-text">Copy Result</button>
    </div>
    <div class="options">
      <label>
        <input type="checkbox" id="urlsafe-text" onchange="onUrlSafeChange()">
        <span id="lbl-urlsafe-text">URL-safe Base64 (replace +/ with -_ and remove =)</span>
      </label>
    </div>
  </div>

  <!-- ================= FILE TAB ================= -->
  <div id="tab-file" class="card hidden">
    <input type="file" id="file-input" onchange="onFileSelected()">
    <div class="file-info" id="file-info"></div>
    <div class="actions">
      <button class="btn" onclick="encodeFile()" id="btn-encode-file">Encode File</button>
      <button class="btn blue" onclick="decodeFile()" id="btn-decode-file">Decode & Download</button>
      <button class="btn gray" onclick="clearFile()" id="btn-clear-file">Clear</button>
    </div>
    <div class="output" id="file-output"></div>
    <div class="actions">
      <button class="btn blue" onclick="copyOut('file-output')" id="btn-copy-file">Copy Result</button>
    </div>
    <div class="options">
      <label>
        <input type="checkbox" id="urlsafe-file">
        <span id="lbl-urlsafe-file">URL-safe Base64 (replace +/ with -_ and remove =)</span>
      </label>
    </div>
  </div>

<script>
/* =========================================================
   i18n Dictionary
   ========================================================= */
const I18N = {
  en: {
    title: 'Base64 Encoder / Decoder',
    tabText: 'Text',
    tabFile: 'File',
    inputPlaceholder: 'Enter text here...',
    outputPlaceholder: 'Result will appear here...',
    encodeText: 'Encode to Base64',
    decodeText: 'Decode from Base64',
    clear: 'Clear',
    copy: 'Copy Result',
    copied: 'Copied!',
    urlsafe: 'URL-safe Base64 (replace +/ with -_ and remove =)',
    encodeFile: 'Encode File',
    decodeFile: 'Decode & Download',
    noFile: 'No file selected.',
    fileSize: 'Size',
    fileType: 'Type',
    errorEncode: 'Encoding error: ',
    errorDecode: 'Decoding error: ',
    invalidBase64: 'Invalid Base64 string.',
    downloaded: 'File downloaded: ',
    decodedEmpty: 'Nothing to decode. Please paste Base64 content into the input box (File tab).',
    decodeFileHint: 'To decode a file: paste its Base64 string into the file tab input and click Decode & Download.',
  },
  fa: {
    title: 'کدگذار / کدگشای Base64',
    tabText: 'متن',
    tabFile: 'فایل',
    inputPlaceholder: 'متن خود را اینجا وارد کنید...',
    outputPlaceholder: 'نتیجه اینجا نمایش داده می‌شود...',
    encodeText: 'تبدیل متن به Base64',
    decodeText: 'تبدیل Base64 به متن',
    clear: 'پاک کردن',
    copy: 'کپی نتیجه',
    copied: 'کپی شد!',
    urlsafe: 'حالت URL-safe (تبدیل +/ به -_ و حذف =)',
    encodeFile: 'تبدیل فایل به Base64',
    decodeFile: 'تبدیل و دانلود فایل',
    noFile: 'فایلی انتخاب نشده است.',
    fileSize: 'حجم',
    fileType: 'نوع',
    errorEncode: 'خطا در کدگذاری: ',
    errorDecode: 'خطا در کدگشایی: ',
    invalidBase64: 'رشته Base64 نامعتبر است.',
    downloaded: 'فایل دانلود شد: ',
    decodedEmpty: 'چیزی برای تبدیل نیست. لطفاً رشته Base64 را در کادر ورودی قرار دهید (تب فایل).',
    decodeFileHint: 'برای تبدیل فایل: رشته Base64 آن را در کادر تب فایل قرار دهید و روی «تبدیل و دانلود فایل» کلیک کنید.',
  }
};

let currentLang = 'en';

/* =========================================================
   Language switching
   ========================================================= */
function setLang(lang) {
  currentLang = lang;
  const t = I18N[lang];
  const html = document.documentElement;

  html.lang = lang;
  html.dir = lang === 'fa' ? 'rtl' : 'ltr';

  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-fa').classList.toggle('active', lang === 'fa');

  document.getElementById('page-title').textContent = t.title;
  document.getElementById('tab-text-btn').textContent = t.tabText;
  document.getElementById('tab-file-btn').textContent = t.tabFile;

  document.getElementById('text-input').placeholder = t.inputPlaceholder;
  document.getElementById('btn-encode-text').textContent = t.encodeText;
  document.getElementById('btn-decode-text').textContent = t.decodeText;
  document.getElementById('btn-clear-text').textContent = t.clear;
  document.getElementById('btn-copy-text').textContent = t.copy;
  document.getElementById('lbl-urlsafe-text').textContent = t.urlsafe;

  document.getElementById('btn-encode-file').textContent = t.encodeFile;
  document.getElementById('btn-decode-file').textContent = t.decodeFile;
  document.getElementById('btn-clear-file').textContent = t.clear;
  document.getElementById('btn-copy-file').textContent = t.copy;
  document.getElementById('lbl-urlsafe-file').textContent = t.urlsafe;

  // update file info if a file is selected
  if (document.getElementById('file-input').files[0]) onFileSelected();
}

/* =========================================================
   Tabs
   ========================================================= */
function switchTab(name) {
  document.getElementById('tab-text').classList.toggle('hidden', name !== 'text');
  document.getElementById('tab-file').classList.toggle('hidden', name !== 'file');
  document.getElementById('tab-text-btn').classList.toggle('active', name === 'text');
  document.getElementById('tab-file-btn').classList.toggle('active', name === 'file');
}

/* =========================================================
   Helpers - Unicode-safe Base64
   ========================================================= */
function b64EncodeUnicode(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function b64DecodeUnicode(str) {
  // normalize URL-safe
  str = str.replace(/-/g, '+').replace(/_/g, '/').replace(/\s+/g, '');
  // add padding if missing
  const pad = str.length % 4;
  if (pad) str += '='.repeat(4 - pad);

  const binary = atob(str);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function toUrlSafe(b64) {
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function base64ToArrayBuffer(b64) {
  b64 = b64.replace(/-/g, '+').replace(/_/g, '/').replace(/\s+/g, '');
  const pad = b64.length % 4;
  if (pad) b64 += '='.repeat(4 - pad);
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

/* =========================================================
   Copy
   ========================================================= */
function copyOut(id) {
  const text = document.getElementById(id).textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    alert(I18N[currentLang].copied);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    alert(I18N[currentLang].copied);
  });
}

/* =========================================================
   Text tab logic
   ========================================================= */
function onUrlSafeChange() {
  // re-run last operation if there's something
  const out = document.getElementById('text-output');
  if (out.textContent) {
    // try decode to re-encode or vice versa? Simpler: just leave as-is.
    // User can click encode/decode again.
  }
}

function encodeText() {
  const t = I18N[currentLang];
  const input = document.getElementById('text-input').value;
  const out = document.getElementById('text-output');
  try {
    let b64 = b64EncodeUnicode(input);
    if (document.getElementById('urlsafe-text').checked) b64 = toUrlSafe(b64);
    out.classList.remove('error');
    out.textContent = b64 || t.outputPlaceholder;
  } catch (e) {
    out.classList.add('error');
    out.textContent = t.errorEncode + e.message;
  }
}

function decodeText() {
  const t = I18N[currentLang];
  const input = document.getElementById('text-input').value.trim();
  const out = document.getElementById('text-output');
  if (!input) {
    out.classList.remove('error');
    out.textContent = t.outputPlaceholder;
    return;
  }
  try {
    const decoded = b64DecodeUnicode(input);
    out.classList.remove('error');
    out.textContent = decoded;
    // if user language is Persian, and decoded text has Persian, direction will handle itself
  } catch (e) {
    out.classList.add('error');
    out.textContent = t.errorDecode + e.message;
  }
}

function clearText() {
  document.getElementById('text-input').value = '';
  document.getElementById('text-output').textContent = '';
  document.getElementById('text-output').classList.remove('error');
}

/* =========================================================
   File tab logic
   ========================================================= */
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function onFileSelected() {
  const t = I18N[currentLang];
  const file = document.getElementById('file-input').files[0];
  const info = document.getElementById('file-info');
  if (!file) {
    info.textContent = t.noFile;
    return;
  }
  info.textContent = `${file.name} — ${t.fileSize}: ${formatSize(file.size)} — ${t.fileType}: ${file.type || 'unknown'}`;
}

async function encodeFile() {
  const t = I18N[currentLang];
  const file = document.getElementById('file-input').files[0];
  const out = document.getElementById('file-output');
  if (!file) {
    alert(t.noFile);
    return;
  }
  try {
    out.classList.remove('error');
    out.textContent = '...';
    const buffer = await file.arrayBuffer();
    let b64 = arrayBufferToBase64(buffer);
    if (document.getElementById('urlsafe-file').checked) b64 = toUrlSafe(b64);
    out.textContent = b64;
  } catch (e) {
    out.classList.add('error');
    out.textContent = t.errorEncode + e.message;
  }
}

function decodeFile() {
  const t = I18N[currentLang];
  const out = document.getElementById('file-output');
  const b64 = out.textContent.trim();

  if (!b64) {
    alert(t.decodedEmpty);
    return;
  }

  try {
    const buffer = base64ToArrayBuffer(b64);
    const bytes = new Uint8Array(buffer);

    // Try to detect file type from magic bytes
    const { mime, ext } = detectFileType(bytes);

    // Determine filename
    const selectedFile = document.getElementById('file-input').files[0];
    let filename = selectedFile
      ? selectedFile.name.replace(/\.[^.]+$/, '') + '_decoded.' + ext
      : 'decoded.' + ext;

    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    out.classList.remove('error');
    alert(t.downloaded + filename);
  } catch (e) {
    out.classList.add('error');
    alert(t.invalidBase64 + '\n' + e.message);
  }
}

function clearFile() {
  document.getElementById('file-input').value = '';
  document.getElementById('file-output').textContent = '';
  document.getElementById('file-output').classList.remove('error');
  document.getElementById('file-info').textContent = '';
}

/* =========================================================
   File type detection (magic bytes)
   ========================================================= */
function detectFileType(bytes) {
  const hex = (arr, len) => Array.from(arr.slice(0, len)).map(b => b.toString(16).padStart(2, '0')).join('');

  const signatures = [
    { sig: '89504e47', mime: 'image/png', ext: 'png' },
    { sig: 'ffd8ff',   mime: 'image/jpeg', ext: 'jpg' },
    { sig: '47494638', mime: 'image/gif', ext: 'gif' },
    { sig: '52494646', mime: 'audio/wav', ext: 'wav' }, // RIFF - could be avi too
    { sig: '25504446', mime: 'application/pdf', ext: 'pdf' },
    { sig: '504b0304', mime: 'application/zip', ext: 'zip' },
    { sig: '1f8b',     mime: 'application/gzip', ext: 'gz' },
    { sig: '424d',     mime: 'image/bmp', ext: 'bmp' },
    { sig: '49492a00', mime: 'image/tiff', ext: 'tiff' },
    { sig: '4d4d002a', mime: 'image/tiff', ext: 'tiff' },
    { sig: '7f454c46', mime: 'application/x-executable', ext: 'elf' },
    { sig: '4d5a',     mime: 'application/x-msdownload', ext: 'exe' },
    { sig: '00000018', mime: 'video/mp4', ext: 'mp4' },
    { sig: '00000020', mime: 'video/mp4', ext: 'mp4' },
    { sig: '1a45dfa3', mime: 'video/webm', ext: 'webm' },
    { sig: '4f676753', mime: 'audio/ogg', ext: 'ogg' },
    { sig: '664c6143', mime: 'audio/flac', ext: 'flac' },
    { sig: '494433',   mime: 'audio/mpeg', ext: 'mp3' },
  ];

  for (const s of signatures) {
    if (hex(bytes, s.sig.length / 2) === s.sig) {
      return { mime: s.mime, ext: s.ext };
    }
  }

  // Try to guess text
  try {
    new TextDecoder('utf-8', { fatal: true }).decode(bytes.slice(0, 512));
    return { mime: 'text/plain', ext: 'txt' };
  } catch (_) {}

  return { mime: 'application/octet-stream', ext: 'bin' };
}

/* =========================================================
   Init
   ========================================================= */
window.addEventListener('DOMContentLoaded', () => {
  setLang('en');
});
</script>
</body>
</html>
